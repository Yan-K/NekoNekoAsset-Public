name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14.8
      - name: Install pinned tools
        shell: pwsh
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache Rust tests and registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            app/src-tauri/target/debug
            ~/.cargo/registry
          # Caches are immutable: retain the newest successful source build.
          key: windows-2022-rust-1.99.0-tests-v2-${{ hashFiles('app/src-tauri/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            windows-2022-rust-1.99.0-tests-v2-${{ hashFiles('app/src-tauri/Cargo.lock') }}-
            windows-2022-rust-1.99.0-tests-v2-
      - name: Validate public inputs and release logic
        run: |
          python scripts/release.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/update-notices.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build frontend
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing Rust tests
        run: cargo test --locked --lib --manifest-path app/src-tauri/Cargo.toml

  bridge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14.8
      - name: Verify Bridge archive bytes, inventory and GUIDs
        run: python unity/scripts/package_bridge.py unity/Packages/com.yank.nekonekoasset.bridge build/bridge
