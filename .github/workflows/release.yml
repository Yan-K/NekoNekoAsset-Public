name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing shared version tag (v0.2.0); published tags refresh Pages only
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      published: ${{ steps.prepare.outputs.published }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14.8
      - name: Check shared version, local verification and immutable release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release.py prepare --tag "$RELEASE_TAG"

  windows:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14.8
      - name: Install pinned tools
        shell: pwsh
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.99.0 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/src-tauri/target
          key: windows-2022-rust-1.99.0-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: windows-2022-rust-1.99.0-
      - name: Check packaged notices and release validation
        run: |
          python scripts/update-notices.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Run existing Rust tests
        run: cargo test --locked --lib --manifest-path app/src-tauri/Cargo.toml
      - name: Clear owned cached NSIS output
        shell: pwsh
        run: |
          $taskWorkspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $taskNsis = [IO.Path]::GetFullPath((Join-Path $taskWorkspace 'app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'))
          if (-not $taskNsis.StartsWith($taskWorkspace + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'Installer cleanup escaped workspace.' }
          $taskAncestor = $taskNsis
          while ($taskAncestor) {
            if ((Test-Path -LiteralPath $taskAncestor) -and ((Get-Item -LiteralPath $taskAncestor -Force).Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Installer cleanup refuses reparse ancestors.' }
            if ($taskAncestor -eq $taskWorkspace) { break }
            $taskAncestor = Split-Path -LiteralPath $taskAncestor
          }
          if (Test-Path -LiteralPath $taskNsis) {
            $taskPending = [Collections.Generic.Stack[string]]::new()
            $taskPending.Push($taskNsis)
            while ($taskPending.Count) {
              $taskItem = Get-Item -LiteralPath $taskPending.Pop() -Force
              if ($taskItem.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Installer cleanup refuses reparse descendants.' }
              if ($taskItem.PSIsContainer) { Get-ChildItem -LiteralPath $taskItem.FullName -Force | ForEach-Object { $taskPending.Push($_.FullName) } }
            }
            Remove-Item -LiteralPath $taskNsis -Recurse -Force
          }
      - name: Build signed Windows x64 NSIS installer
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Missing Tauri updater signing key secret.' }
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect installer and signature only
        run: python scripts/release.py collect-app --bundle app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis --output build/release-app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-app
          path: build/release-app/*
          if-no-files-found: error
          retention-days: 7

  bridge:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14.8
      - name: Package and verify all three Bridge formats
        run: python unity/scripts/package_bridge.py unity/Packages/com.yank.nekonekoasset.bridge build/release-bridge
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bridge
          path: build/release-bridge/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, windows, bridge]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.published == 'true' ||
      (needs.windows.result == 'success' && needs.bridge.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14.8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.prepare.outputs.published != 'true'
        with:
          pattern: release-*
          merge-multiple: true
          path: build/release
      - name: Upload complete assets to draft, then publish together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release.py publish --tag "$RELEASE_TAG" --artifacts build/release

  pages:
    needs: publish
    runs-on: ubuntu-24.04
    # Lock the entire feed generation and deployment, across every release tag.
    concurrency:
      group: public-update-feeds
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.14.8
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Regenerate both feeds from highest complete published version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py pages --output build/pages
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages
      - name: Deploy update feeds
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
