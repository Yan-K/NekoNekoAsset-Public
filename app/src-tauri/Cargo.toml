[package]
name = "nekonekoasset"
version = "0.2.1"
description = "Local digital asset manager"
authors = ["Yan-K"]
edition = "2021"
license = "MIT"

[lib]
name = "nekonekoasset_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
semver = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "stream"] }
url = "2"
scraper = "0.24"
rusqlite = { version = "0.37", features = ["bundled"] }
automerge = "0.7"
unicode-normalization = "0.1"
sha2 = "0.10"
hex = "0.4"
base64 = "=0.22.1"
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
fs2 = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
# Local OS phonetic reading for Japanese avatar names; no network or model lookup.
windows = { version = "0.62.2", features = ["Globalization", "Win32_Foundation", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Optimized, isolated local verification; default production release has no data-dir override.
[profile.integration]
inherits = "release"
debug-assertions = true

# Keep only this crate's isolated-data guard enabled; dependencies use release checks.
[profile.integration.package."*"]
debug-assertions = false
